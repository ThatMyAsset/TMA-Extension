name: extension-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run package
      - uses: softprops/action-gh-release@v2
        with:
          name: ThatMyAssets Browser Extension ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.zip
            release/*.sha256
